<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر العطور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h1>متجر العطور</h1>
    
    <div id="products-container" style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">جاري تحميل العطور...</div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzYORVsjwSYkABKFvKkoz7FC2wczyWv093tK1v6ZIr_HzmYXs9G0nNaXeNVpE0auF8IBw/exec';
        const WHATSAPP_NUMBER = '963911111111'; // استبدل هذا برقمك

        async function loadProducts() {
            try {
                const response = await fetch(API_URL);
                const products = await response.json();
                
                const container = document.getElementById('products-container');
                container.innerHTML = ''; 

                products.forEach(product => {
                    if (!product.name) return;

                    const message = encodeURIComponent(`مرحباً، أهتم بالاستفسار أو طلب عطر: ${product.name}`);
                    const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

                    const card = document.createElement('div');
                    card.style.cssText = "border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; text-align: center; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);";
                    
                    card.innerHTML = `
                        <div style="font-size: 40px;">${product.icon || '🌹'}</div>
                        <img src="images/${product.image}" alt="${product.name}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 4px; margin-top: 10px;" onerror="this.style.display='none'">
                        <h3 style="margin: 10px 0 5.0px; color: #333;">${product.name}</h3>
                        <p style="font-size: 13px; color: #666; height: 40px; overflow: hidden;">${product.description}</p>
                        
                        <a href="${whatsappLink}" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #25d366; color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 4px; margin-top: 10px; font-size: 14px; width: 100%; box-sizing: border-box;">
                            <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> تواصل معنا
                        </a>
                    `;
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('products-container').textContent = 'خطأ في تحميل المنتجات.';
            }
        }

        loadProducts();
    </script>
</body>
</html>
