<!-- صفحة اختبار وعرض متجر العطور -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر العطور</title>
</head>
<body>
    <h1>API Test</h1>
    <h2>hello Ahmad</h2>
    
    <!-- قسم عرض المنتجات -->
    <div id="products-container" style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;"></div>

    <!-- لعرض النص الخام للـ API للاختبار -->
    <pre id="result" style="background: #f4f4f4; padding: 10px; margin-top: 20px;"></pre>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzYORVsjwSYkABKFvKkoz7FC2wczyWv093tK1v6ZIr_HzmYXs9G0nNaXeNVpE0auF8IBw/exec';

        async function loadProducts() {
            try {
                const response = await fetch(API_URL);
                
                // حفظ النسخة النصية لعرضها في عنصر الـ pre للاختبار
                const text = await response.text();
                document.getElementById('result').textContent = text;
                
                // تحويل النص إلى كائنات JSON للتعامل مع المنتجات وعرضها
                const products = JSON.parse(text);
                
                const container = document.getElementById('products-container');
                container.innerHTML = ''; // تنظيف الكلمة الافتراضية

                products.forEach(product => {
                    if (!product.name) return;

                    const card = document.createElement('div');
                    card.style.cssText = "border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 200px; text-align: center; background: #fff;";
                    
                    card.innerHTML = `
                        <div style="font-size: 40px;">${product.icon || '🌹'}</div>
                        <img src="images/${product.image}" alt="${product.name}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 4px; margin-top: 10px;" onerror="this.src='https://via.placeholder.com/150'">
                        <h3>${product.name}</h3>
                        <p style="font-size: 14px; color: #666;">${product.description}</p>
                        <p style="font-weight: bold; color: #2ecc71;">$${product.price}</p>
                        <button style="background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">اطلب الآن</button>
                    `;
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }

        loadProducts();
    </script>
</body>
</html>
